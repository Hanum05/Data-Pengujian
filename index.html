<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pengujian</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #20252b;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main { width: min(720px, 100%); }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 36px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .file-button {
      min-height: 105px;
      border: 1px solid #dce1e6;
      border-radius: 12px;
      background: white;
      color: #20252b;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .file-button:hover {
      border-color: #8b9aaa;
      box-shadow: 0 8px 22px #1b29351a;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .68);
    }

    .overlay.open { display: flex; }

    .viewer {
      width: min(1100px, 100%);
      height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 10px;
      background: white;
    }

    .toolbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    #fileTitle { font-weight: bold; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions a,
    .actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      background: #20252b;
      color: white;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .actions .close {
      background: #e9edf1;
      color: #20252b;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1;
      border: 0;
      background: #e5e7eb;
    }

    @media (max-width: 600px) {
      body { padding: 18px; }

      .menu {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .file-button { min-height: 72px; }

      .overlay { padding: 7px; }

      .viewer { height: 96vh; }

      .toolbar { padding: 8px; }

      .actions { gap: 5px; }

      .actions a,
      .actions button {
        padding: 0 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main>
    <h1>Data Pengujian</h1>

    <section class="menu">
      <button class="file-button" data-file="Data AAS.pdf">
        Data AAS
      </button>

      <button class="file-button" data-file="Data HPLC.pdf">
        Data HPLC
      </button>

      <button class="file-button" data-file="Data LC-HRMS.pdf">
        Data LC-HRMS
      </button>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <section class="viewer">

      <header class="toolbar">
        <span id="fileTitle">Dokumen PDF</span>

        <div class="actions">
          <a id="downloadLink" href="#" download>
            Download PDF
          </a>

          <button class="close" id="closeButton">
            Tutup ✕
          </button>
        </div>
      </header>

      <iframe
        id="pdfFrame"
        title="Dokumen PDF"
        src="about:blank">
      </iframe>

    </section>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const pdfFrame = document.getElementById('pdfFrame');
    const fileTitle = document.getElementById('fileTitle');
    const downloadLink = document.getElementById('downloadLink');

    document.querySelectorAll('.file-button').forEach(button => {
      button.addEventListener('click', () => {
        const file = button.dataset.file;
        const fileUrl = encodeURI(file);

        fileTitle.textContent = file;
        pdfFrame.src = fileUrl;
        downloadLink.href = fileUrl;
        downloadLink.setAttribute('download', file);

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeViewer() {
      overlay.classList.remove('open');
      pdfFrame.src = 'about:blank';
      document.body.style.overflow = '';
    }

    document.getElementById('closeButton')
      .addEventListener('click', closeViewer);

    overlay.addEventListener('click', event => {
      if (event.target === overlay) {
        closeViewer();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' &&
          overlay.classList.contains('open')) {
        closeViewer();
      }
    });
  </script>

</body>
</html>
